
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabloom | Shared Expenses</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>Tabloom</h1>
      <p>Keep track of shared expenses</p>
    </header>


<div class="dashboard">
  <div class="dashboard-left">

    <section class="summary">
      <h2>Your balance</h2>

      <label for="current-user">Viewing as</label>
      <select id="current-user">
        <option value="Josh">Josh</option>
        <option value="Nicole">Nicole</option>
        <option value="Trevor">Trevor</option>
        <option value="Vee">Vee</option>
        <option value="Lily">Lily</option>
      </select>

      <div id="personal-balance">
        Loading balance...
      </div>

      <div class="individual-balances">
        <h3>Individual balances</h3>
        <div id="individual-balances">
          Loading balances...
        </div>
      </div>

      <div class="outstanding-section">
      <h3>Total outstanding</h3>
      <p id="outstanding-total">$0.00</p>
      </div>
    </section>
  </div>

  <div class="dashboard-right">
        <section class="add-expense">
      <h2>Add an expense</h2>

      <form id="expense-form">
        <label for="description">Description</label>
        <input type="text" id="description" name="description" maxlength="100" required>

        <label for="paid_by">Who paid?</label>
        <select id="paid_by" name="paid_by" required>
          <option value="" disabled selected>Select a name</option>
          <option value="Josh">Josh</option>
          <option value="Nicole">Nicole</option>
          <option value="Trevor">Trevor</option>
          <option value="Vee">Vee</option>
          <option value="Lily">Lily</option>
        </select>

        <fieldset class="participant-selection">
          <legend>Who was paid for?</legend>

          <div id="owed-by-options">
            <label><input type="checkbox" name="owed_by" value="Josh"> Josh</label>
            <label><input type="checkbox" name="owed_by" value="Nicole"> Nicole</label>
            <label><input type="checkbox" name="owed_by" value="Trevor"> Trevor</label>
            <label><input type="checkbox" name="owed_by" value="Vee"> Vee</label>
            <label><input type="checkbox" name="owed_by" value="Lily"> Lily</label>
          </div>
        </fieldset>

        <label class="payer-toggle">
          <input type="checkbox" id="include-payer" checked>
          Include the person who paid?
        </label>

        <label for="amount">Amount</label>
        <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>

        <label for="date">Date</label>
        <input type="date" id="date" name="date" required>

        <div class="form-actions">
          <button type="submit">Add expense</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>
            Cancel edit
          </button>
        </div>

        <p id="form-message" role="status"></p>
      </form>
    </section>

  </div>
</div>
    <section class="expense-history">
      <h2>Expenses</h2>
      <div id="expenses-list">
        <p>Loading expenses...</p>
      </div>
    </section>
</main>
  
  <dialog id="delete-dialog">
  <h2>Delete this expense?</h2>
  <p id="delete-message"></p>

  <div class="dialog-actions">
    <button type="button" id="cancel-delete" class="secondary">
      Cancel
    </button>
    <button type="button" id="confirm-delete">
      Delete
    </button>
  </div>
</div>
</dialog>
</body>
</html>
